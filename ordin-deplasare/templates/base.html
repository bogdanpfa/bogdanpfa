<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ordin de Deplasare{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card-header { background: #0d3b6e; color: #fff; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.03em; }
    .section-title {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #6c757d; border-bottom: 2px solid #dee2e6;
      padding-bottom: 4px; margin-bottom: 12px;
    }
    .autocomplete-results {
      position: absolute; z-index: 1000; width: 100%;
      max-height: 280px; overflow-y: auto;
      background: #fff; border: 1px solid #ced4da; border-radius: .375rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    .autocomplete-results .item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f1f1;
    }
    .autocomplete-results .item:hover { background: #e9f0fa; }
    .autocomplete-results .item .marca { font-size: .75rem; color: #888; }
    .row-cheltuiala input { font-size: .85rem; }
    #total-display { font-weight: 700; color: #0d3b6e; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0d3b6e;">
  <div class="container-lg">
    <span class="navbar-brand"><i class="bi bi-file-earmark-text me-2"></i>Ordin de Deplasare</span>
    <span class="text-white-50 small">SRTFC Iași · CFR Călători</span>
  </div>
</nav>
<div class="container-lg py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
