<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagină negăsită – STIZO NPC</title>
  <meta name="description" content="Pagina căutată nu există. Revino la pagina principală STIZO NPC Iași.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <!-- Căi absolute: 404 poate fi servită de la orice adresă -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="not-found">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow eyebrow-dark">Eroare 404</p>
      <h1 class="code">404</h1>
      <p>Pagina pe care o cauți nu există sau a fost mutată. Fundația e însă solidă — te ducem înapoi.</p>
      <a href="/" class="btn btn-primary">Înapoi la pagina principală</a>
    </div>
  </main>
</body>
</html>
