<!doctype html>
<html lang="ro" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ordin de Deplasare{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; transition: background .2s ease, color .2s ease; }
    [data-bs-theme="dark"] body { background: #121820; }

    .card-header { background: #0d3b6e; color: #fff; }
    [data-bs-theme="dark"] .card-header { background: #0a2a52; }

    .navbar-brand { font-weight: 700; letter-spacing: 0.03em; }

    .section-title {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #6c757d; border-bottom: 2px solid #dee2e6;
      padding-bottom: 4px; margin-bottom: 12px;
    }
    [data-bs-theme="dark"] .section-title { color: #9aa8bf; border-bottom-color: #2d3748; }

    .autocomplete-results {
      position: absolute; z-index: 1000; width: 100%;
      max-height: 280px; overflow-y: auto;
      background: #fff; border: 1px solid #ced4da; border-radius: .375rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    [data-bs-theme="dark"] .autocomplete-results {
      background: #1e2a3a; border-color: #2d3748;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .autocomplete-results .item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f1f1;
    }
    [data-bs-theme="dark"] .autocomplete-results .item { border-bottom-color: #2d3748; color: #e2e8f0; }
    .autocomplete-results .item:hover { background: #e9f0fa; }
    [data-bs-theme="dark"] .autocomplete-results .item:hover { background: #2d3e55; }
    .autocomplete-results .item .marca { font-size: .75rem; color: #888; }

    .row-cheltuiala input { font-size: .85rem; }
    #total-display { font-weight: 700; color: #0d3b6e; }
    [data-bs-theme="dark"] #total-display { color: #60a5fa; }

    #theme-btn { transition: transform .3s ease; }
    #theme-btn:hover { transform: rotate(20deg); }
  </style>
  <script>
    /* Aplică tema salvată înainte ca pagina să se randeze — fără flash */
    (function() {
      try {
        var t = localStorage.getItem('od-theme');
        if (t) document.documentElement.setAttribute('data-bs-theme', t);
        else if (matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-bs-theme', 'dark');
      } catch(e) {}
    })();
  </script>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0d3b6e;">
  <div class="container-lg d-flex align-items-center gap-2">
    <span class="navbar-brand mb-0"><i class="bi bi-file-earmark-text me-2"></i>Ordin de Deplasare</span>
    <span class="text-white-50 small me-auto">SRTFC Iași · CFR Călători</span>
    <button id="theme-btn" class="btn btn-sm btn-outline-light" type="button" title="Schimbă tema">
      <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
    </button>
    <a href="http://cl6srvappiasi/" class="btn btn-sm btn-outline-light">
      <i class="bi bi-house me-1"></i>Acasă
    </a>
  </div>
</nav>
<div class="container-lg py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function() {
    var html = document.documentElement;
    var btn  = document.getElementById('theme-btn');
    var icon = document.getElementById('theme-icon');

    function applyTheme(t) {
      html.setAttribute('data-bs-theme', t);
      icon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
      try { localStorage.setItem('od-theme', t); } catch(e) {}
    }

    /* Sincronizează iconița cu tema curentă la încărcare */
    applyTheme(html.getAttribute('data-bs-theme') || 'light');

    btn.addEventListener('click', function() {
      applyTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
